<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
        }
        
        .product-slideshow {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .slideshow-container {
            position: relative;
            width: 70%;
            max-width: 900px;
            height: 500px;
            overflow: hidden;
            border-radius: 12px;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #1a1a1a;
        }

        .slide-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: auto;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            color: #fff;
            padding: 20px;
            text-align: left;
        }

        .slide-caption h3 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            font-family: 'Arial', 'Helvetica', sans-serif;
            letter-spacing: 0.5px;
        }

        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -22px;
            color: white;
            font-weight: bold;
            font-size: 24px;
            transition: 0.6s ease;
            border-radius: 0 3px 3px 0;
            user-select: none;
            background-color: rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .next {
            right: 0;
            border-radius: 3px 0 0 3px;
        }

        .prev:hover, .next:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .slideshow-dots {
            text-align: center;
            padding: 20px 0;
        }

        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #555;
            margin: 0 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .dot.active {
            background: #fff;
        }

        .dot:hover {
            background: #888;
        }
    </style>
</head>
<body>
    <div class="product-slideshow">
        <div class="slideshow-container">
            <div class="slide active" data-product="cloudsync">
                <img src="images/blue_sandbox.png" alt="CloudSync Pro">
                <div class="slide-caption">
                    <h3>Blue</h3>
                </div>
            </div>
            <div class="slide" data-product="dataviz">
                <img src="images/recon.jpg" alt="DataViz Analytics">
                <div class="slide-caption">
                    <h3>Recon</h3>
                </div>
            </div>
            <div class="slide" data-product="secureguard">
                <img src="images/soraka.png" alt="SecureGuard">
                <div class="slide-caption">
                    <h3>Soraka</h3>
                </div>
            </div>
            <div class="slide" data-product="aiassistant">
                <img src="images/viktor.png" alt="AI Assistant">
                <div class="slide-caption">
                    <h3>Viktor</h3>
                </div>
            </div>

            <a class="prev">❮</a>
            <a class="next">❯</a>
        </div>
        <div class="slideshow-dots">
            <span class="dot active" data-index="0"></span>
            <span class="dot" data-index="1"></span>
            <span class="dot" data-index="2"></span>
            <span class="dot" data-index="3"></span>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const slides = document.querySelectorAll(".slide")
            const dots = document.querySelectorAll(".dot")
            const prevBtn = document.querySelector(".prev")
            const nextBtn = document.querySelector(".next")
            let currentSlide = 0

            function showSlide(index) {
                slides.forEach((slide) => slide.classList.remove("active"))
                dots.forEach((dot) => dot.classList.remove("active"))
                slides[index].classList.add("active")
                dots[index].classList.add("active")
            }

            function nextSlide() {
                currentSlide = (currentSlide + 1) % slides.length
                showSlide(currentSlide)
            }

            function prevSlide() {
                currentSlide = (currentSlide - 1 + slides.length) % slides.length
                showSlide(currentSlide)
            }

            prevBtn.addEventListener("click", prevSlide)
            nextBtn.addEventListener("click", nextSlide)

            dots.forEach((dot, index) => {
                dot.addEventListener("click", () => {
                    currentSlide = index
                    showSlide(currentSlide)
                })
            })
        })
    </script>
</body>
</html>
